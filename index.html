<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VIP_REVEAL_PROTOCOL</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;500&display=swap" rel="stylesheet">
</head>
<body>
    <audio id="beep" src="https://www.soundjay.com/buttons/sounds/beep-07.mp3"></audio>
    <audio id="reveal-music" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"></audio>

    <div id="ghost-layer" class="ghost-layer"></div>

    <!-- FLIGHT OVERLAY -->
    <div id="flight-reveal" class="globe-animation">
        <div class="plane-icon">✈️</div>
        <p style="color:var(--gold); letter-spacing: 5px; margin-top:20px;">SYNCING_GLOBAL_GPS...</p>
    </div>

    <div class="container">
        <!-- TERMINAL -->
        <section id="auth-screen" class="active">
            <div class="terminal-window">
                <div id="terminal-output">
                    <p class="success">> IDENTITY VERIFICATION: JILL BHANSALI</p>
                    <p class="hint">Q1: Departure date? (DDMM)</p>
                </div>
                <div class="input-line">
                    <span class="cursor">></span>
                    <input type="text" id="terminal-input" autofocus autocomplete="off" spellcheck="false">
                </div>
            </div>
        </section>

        <!-- FINAL REVEAL -->
        <section id="reveal-screen">
            <div class="boarding-pass" id="pass-content">
                <header style="display:flex; justify-content:space-between; font-size:0.6rem; letter-spacing:2px; color:var(--gold);">
                    <span>BEYOND_BORDERS</span>
                    <span>MAY 07 - 11</span>
                </header>
                
                <div class="main-reveal">
                    <h1>BALI</h1>
                    <p style="color:var(--dim); letter-spacing:5px; font-size:0.8rem;">ULUWATU // SAVAYA</p>
                </div>

                <div class="timer-box"><p id="countdown">T-MINUS 00:00:00:00</p></div>

                <div class="itinerary" style="text-align:left; font-size:0.8rem;">
                    <p style="border-left:1px solid var(--gold); padding-left:10px; margin-bottom:10px;">
                        <span style="color:var(--gold); font-size:0.6rem;">DAY 01</span><br>BOM ✈️ DPS | B-Day Sundowner @ Savaya
                    </p>
                    <p style="border-left:1px solid var(--gold); padding-left:10px;">
                        <span style="color:var(--gold); font-size:0.6rem;">MAY 08-11</span><br>Private Yacht // Uluwatu Temple // Beach Bliss
                    </p>
                </div>

                <button id="snap-btn" class="share-btn" onclick="toggleSnapshot()">SNAPSHOT_MODE</button>
            </div>
        </section>
    </div>

    <script>
        const QUESTIONS = [
            { q: "Q1: Departure date? (DDMM)", a: "0705" },
            { q: "Q2: The dish I keep ordering but you hate it?", a: "wok" },
            { q: "Q3: Enter your favorite movie...", a: "kkkg" },
            { q: "Q4: Our car number?", a: "6259" },
            { q: "Q5: Are we really going to Goa? (Yes/No)", a: "no" },
            { q: "FINAL: Choose (A) Out of Mumbai or (B) Out of India", a: "b" }
        ];

        let step = 0;
        const terminalInput = document.getElementById('terminal-input');
        const output = document.getElementById('terminal-output');
        const beep = document.getElementById('beep');

        document.addEventListener('click', () => terminalInput.focus());

        terminalInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                const val = this.value.toLowerCase().trim();
                if (val !== "") processStep(val);
                this.value = '';
                beep.play();
            }
        });

        function addLine(text, type = '') {
            const p = document.createElement('p');
            p.innerText = text.startsWith('Q') || text.startsWith('FINAL') ? text : `> ${text}`;
            if (type) p.className = type;
            output.appendChild(p);
            document.querySelector('.terminal-window').scrollTop = 999;
        }

        function processStep(val) {
            if (step === 4 && val === "yes") {
                triggerGoaFakeout(); return;
            }
            if (val === QUESTIONS[step].a) {
                addLine(val, 'user-input');
                if (navigator.vibrate) navigator.vibrate(30); 
                step++;
                if (step < QUESTIONS.length) {
                    addLine(`AUTH_SUCCESS_LVL_${step}.`, 'success');
                    addLine(QUESTIONS[step].q, 'hint');
                } else {
                    startRevealSequence();
                }
            } else {
                addLine('ACCESS_DENIED.', 'error');
                if (navigator.vibrate) navigator.vibrate([50, 50, 50]);
            }
        }

        function triggerGoaFakeout() {
            addLine('yes', 'user-input');
            addLine('DESTINATION: GOA...', 'success');
            setTimeout(() => {
                addLine('ERROR: UPGRADE_REQUIRED', 'error');
                if (navigator.vibrate) navigator.vibrate(500); 
                setTimeout(() => {
                    addLine(QUESTIONS[5].q, 'hint');
                    step = 5; 
                }, 1500);
            }, 1000);
        }

        function startRevealSequence() {
            addLine('VALIDATION_COMPLETE. INITIATING_FLASH...', 'success');
            
            setTimeout(() => {
                // THE FACE-LIGHT FLASH
                document.body.classList.add('flash-trigger');
                document.getElementById('flight-reveal').style.display = 'flex';
                
                setTimeout(() => {
                    document.body.classList.remove('flash-trigger');
                    document.getElementById('flight-reveal').style.display = 'none';
                    document.body.classList.add('revealed');
                    document.getElementById('reveal-music').play();
                    document.getElementById('auth-screen').classList.remove('active');
                    document.getElementById('reveal-screen').classList.add('active');
                    
                    setTimeout(() => {
                        document.getElementById('snap-btn').style.display = 'inline-block';
                    }, 3000);

                    startTimer();
                }, 5000);
            }, 1000);
        }

        function toggleSnapshot() {
            document.body.classList.toggle('snapshot-mode');
            const btn = document.getElementById('snap-btn');
            btn.innerText = document.body.classList.contains('snapshot-mode') ? "EXIT_SNAPSHOT" : "SNAPSHOT_MODE";
        }

        function startTimer() {
            const target = new Date("May 7, 2026 00:00:00").getTime();
            setInterval(() => {
                const now = new Date().getTime();
                const diff = target - now;
                const d = Math.floor(diff / (1000 * 60 * 60 * 24));
                const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const s = Math.floor((diff % (1000 * 60)) / 1000);
                document.getElementById('countdown').innerHTML = `T-MINUS ${d}D:${h}H:${m}M:${s}S`;
            }, 1000);
        }
    </script>
</body>
</html>
